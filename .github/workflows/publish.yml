name: Publish

# Cutting a release: publish a GitHub Release on a vX.Y.Z tag.
# Rehearsing: Actions → Publish → Run workflow → dry_run: true.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and attach artifacts only (skip marketplaces)
        type: boolean
        default: true
      version:
        description: Version without v prefix (workflow_dispatch only; release uses tag)
        type: string
        required: false

permissions:
  contents: write

jobs:
  publish:
    name: Build + publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            RAW="${{ github.event.release.tag_name }}"
          else
            RAW="${{ inputs.version }}"
            if [ -z "$RAW" ]; then
              RAW=$(node -p "require('./vscode/package.json').version")
            fi
          fi
          VERSION="${RAW#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Align package versions
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          node -e "
            const fs = require('fs');
            const p = 'vscode/package.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          "
          sed -i "s/^pluginVersion = .*/pluginVersion = ${VERSION}/" jetbrains/gradle.properties
        env:
          VERSION: ${{ steps.ver.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build VSIX
        working-directory: vscode
        run: |
          npm ci
          npm run package

      - name: Test + build JetBrains zip
        working-directory: jetbrains
        run: ./gradlew test buildPlugin --no-daemon

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          gh release upload "$TAG" vscode/*.vsix jetbrains/build/distributions/*.zip --clobber

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: almasix-editors-${{ steps.ver.outputs.version }}
          path: |
            vscode/*.vsix
            jetbrains/build/distributions/*.zip

      - name: Publish to VS Marketplace
        if: github.event_name == 'release' || inputs.dry_run == false
        working-directory: vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT secret is not set" >&2
            exit 1
          fi
          VSIX=$(ls -1 *.vsix | head -n1)
          npx --yes @vscode/vsce publish --packagePath "$VSIX" --pat "$VSCE_PAT"

      - name: Publish to JetBrains Marketplace
        if: github.event_name == 'release' || inputs.dry_run == false
        working-directory: jetbrains
        env:
          JETBRAINS_PUBLISH_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN }}
        run: |
          if [ -z "$JETBRAINS_PUBLISH_TOKEN" ]; then
            echo "JETBRAINS_PUBLISH_TOKEN secret is not set" >&2
            exit 1
          fi
          ./gradlew publishPlugin --no-daemon
